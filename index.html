<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deyby Josue | Software Specialist</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/src/assets/Logo_D.svg">

    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/animations.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- SOUNDS -->
    <audio id="boot-sound" src="" preload="auto"></audio>
    <audio id="type-sound" src="" preload="auto"></audio>

    <!-- INTRO LAYER: LOGO ONLY -->
    <div id="loading-layer" class="loading-layer">
        <div class="logo blinking-logo">
            <img src="/src/assets/Logo_D.svg" alt="Logo" class="loading-logo">
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="app" class="hidden">
        <nav class="glass-nav">
            <div class="logo logo-stacked">
                <img src="/src/assets/Logo_D.svg" alt="Logo" class="nav-logo">
                <div class="logo-text-box">
                    <span class="logo-line-top"></span>
                    <span class="logo-line-bottom"></span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="#about-card" data-text="ABOUT">Sobre</a></li>
                <li><a href="#stack-card" data-text="SKILLS">Habilidades</a></li>
                <li><a href="#exp-card" data-text="PROJECTS">Proyectos</a></li>
                <li><a href="#contact-card" data-text="CONTACT">Contacto</a></li>
            </ul>
        </nav>

        <main>
            <!-- HERO SECTION -->
            <section id="hero" class="hero-section">
                <!-- LEFT: Text Info -->
                <div class="hero-col-left">
                    <div class="role-badge console-badge">
                        DEV • FULL STACK
                    </div>
                    <h1 class="hero-title">DEYBY<br>DERAS</h1>
                    <p class="hero-sub">SOFTWARE DEVELOPER</p>
                    <p class="hero-description">Desarrollador Full Stack con experiencia en.NET Core, React y
                        arquitecturas modernas.- San Pedro Sula, Honduras.</p>
                </div>

                <!-- RIGHT: Halftone Canvas -->
                <div class="hero-col-right">
                    <canvas id="bg-canvas" class="background-canvas"></canvas>
                </div>
            </section>

            <!-- DYNAMIC CONTENT (Injected via JS) -->
            <section id="content-display"></section>
        </main>

        <!-- AMBIENT LIGHTS -->
        <div class="ambient-light light-1"></div>
        <div class="ambient-light light-2"></div>
        <div class="ambient-light light-3"></div>

        <!-- Tron Pixel Race Easter Egg -->
        <div class="tron-race-container">
            <canvas id="tron-race-canvas"></canvas>
        </div>
        <div class="cyber-scanline"></div>
    </div>

    <!-- SKILL DETAIL MODAL -->
    <div id="skill-modal" class="modal-root hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-container">
            <button class="modal-close" id="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-icon-box" id="modal-icon">
                        <i class="devicon-javascript-plain"></i>
                    </div>
                    <div class="modal-title-box">
                        <h2 id="modal-skill-name">Technology Name</h2>
                        <span id="modal-skill-category" class="skill-category">Category</span>
                    </div>
                </div>
                <div class="modal-body">
                    <p id="modal-skill-description">This is where the technology description will go.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
